<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" role="img" aria-label="memory-visa architecture: Robotinc callers authenticate through AgentCore Gateway, then reach access_requests.py and GuardedMemory; GuardedMemory checks GrantStore for an active grant before allowing cross-domain Memory access.">
  <title>memory-visa architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #0F172A; }
    .name { font-size: 14px; font-weight: 700; }
    .sub { font-size: 11px; fill: #64748B; }
    .subtiny { font-size: 9px; fill: #94A3B8; font-style: italic; }
    .label { font-size: 12px; fill: #0F172A; font-weight: 700; }
    .edgeLabel { font-size: 10.5px; fill: #475569; }
    .edgeLabelAccent { font-size: 11px; fill: #B45309; font-weight: 700; }
    .groupLabel { font-size: 11px; font-weight: 700; fill: #64748B; letter-spacing: 1.5px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    .panel { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1.5; }
    .edge { stroke: #475569; stroke-width: 1.5; fill: none; }
    .edgeAccent { stroke: #D97706; stroke-width: 2; fill: none; }
  </style>

  <!-- Robotinc panel -->
  <rect class="panel" x="40" y="40" width="960" height="150" rx="14"/>
  <text class="groupLabel" x="64" y="66">ROBOTINC</text>

  <rect class="box" x="90" y="92" width="200" height="76" rx="10"/>
  <text class="name" x="190" y="124" text-anchor="middle">Maya</text>
  <text class="sub" x="190" y="146" text-anchor="middle">Engineering</text>

  <rect class="box" x="310" y="92" width="200" height="76" rx="10"/>
  <text class="name" x="410" y="124" text-anchor="middle">Liam</text>
  <text class="sub" x="410" y="146" text-anchor="middle">Legal</text>

  <rect class="box" x="530" y="92" width="200" height="76" rx="10"/>
  <text class="name" x="630" y="124" text-anchor="middle">Priya</text>
  <text class="sub" x="630" y="146" text-anchor="middle">Finance</text>

  <rect class="box" x="750" y="92" width="200" height="76" rx="10"/>
  <text class="name" x="850" y="124" text-anchor="middle">Jordan</text>
  <text class="sub" x="850" y="146" text-anchor="middle">Contractor, one project</text>

  <!-- Auth layer -->
  <rect class="box" x="120" y="298" width="170" height="64" rx="10"/>
  <text class="label" x="205" y="326" text-anchor="middle">Cognito</text>
  <text class="sub" x="205" y="346" text-anchor="middle">department / org claims</text>

  <rect class="box" x="380" y="280" width="280" height="100" rx="12"/>
  <text class="label" x="520" y="316" text-anchor="middle" font-size="14">AgentCore Gateway</text>
  <text class="sub" x="520" y="338" text-anchor="middle">CUSTOM_JWT auth</text>
  <text class="sub" x="520" y="356" text-anchor="middle">Cedar ABAC enforcement</text>

  <!-- actors -> gateway -->
  <path class="edge" d="M190,168 L190,210 L442,210 L442,280" marker-end="url(#arrow)"/>
  <path class="edge" d="M410,168 L410,250 L494,250 L494,280" marker-end="url(#arrow)"/>
  <path class="edge" d="M630,168 L630,250 L546,250 L546,280" marker-end="url(#arrow)"/>
  <path class="edge" d="M850,168 L850,210 L598,210 L598,280" marker-end="url(#arrow)"/>

  <!-- cognito -> gateway -->
  <path class="edge" d="M290,330 L380,330" marker-end="url(#arrow)"/>
  <text class="edgeLabel" x="335" y="322" text-anchor="middle">JWT claims</text>

  <!-- gateway -> access_requests.py / GuardedMemory -->
  <path class="edge" d="M520,380 L520,405 L190,405 L190,430" marker-end="url(#arrow)"/>
  <path class="edge" d="M520,380 L520,405 L560,405 L560,430" marker-end="url(#arrow)"/>
  <text class="edgeLabel" x="300" y="399" text-anchor="middle">verified identity</text>

  <!-- Row B -->
  <rect class="box" x="60" y="430" width="260" height="72" rx="10"/>
  <text class="label mono" x="190" y="462" text-anchor="middle">access_requests.py</text>
  <text class="sub" x="190" y="482" text-anchor="middle">request / approve / deny</text>

  <rect class="box" x="440" y="430" width="240" height="72" rx="10"/>
  <text class="label" x="560" y="462" text-anchor="middle" font-size="14">GuardedMemory</text>
  <text class="sub" x="560" y="482" text-anchor="middle">namespace + grant check</text>

  <!-- Row C -->
  <rect class="box" x="60" y="560" width="240" height="64" rx="10"/>
  <text class="label" x="180" y="588" text-anchor="middle" font-size="14">GrantStore</text>
  <text class="sub" x="180" y="606" text-anchor="middle">DynamoDB</text>

  <rect class="box" x="440" y="560" width="240" height="64" rx="10"/>
  <text class="label" x="560" y="588" text-anchor="middle" font-size="14">AgentCore Memory</text>
  <text class="sub" x="560" y="606" text-anchor="middle">short + long-term, semantic</text>

  <rect class="box" x="820" y="560" width="180" height="64" rx="10"/>
  <text class="label" x="910" y="586" text-anchor="middle" font-size="13">GrantNotifier</text>
  <text class="subtiny" x="910" y="604" text-anchor="middle">no destination wired up</text>

  <!-- B -> C -->
  <path class="edge" d="M190,502 L190,560" marker-end="url(#arrow)"/>
  <text class="edgeLabel" x="198" y="534" text-anchor="start">writes</text>

  <path class="edge" d="M560,502 L560,560" marker-end="url(#arrow)"/>
  <text class="edgeLabel" x="568" y="534" text-anchor="start">allowed</text>

  <path class="edge" d="M180,624 L180,648 L910,648 L910,624" marker-end="url(#arrow)"/>
  <text class="edgeLabel" x="545" y="642" text-anchor="middle">every write</text>

  <!-- hero arrow: the actual grant mechanism -->
  <path class="edgeAccent" d="M500,502 L500,512 L120,512 L120,560" marker-end="url(#arrowAccent)"/>
  <text class="edgeLabelAccent" x="310" y="506" text-anchor="middle">active grant?</text>
</svg>
